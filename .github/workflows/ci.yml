name: Composer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NUGET_PACKAGES: ${{ github.workspace }}/.dev-temp/nuget
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Prepare output directories
        run: mkdir -p .dev-temp/packages "${{ runner.temp }}/composer-results" "${{ runner.temp }}/composer-packages"

      - name: Restore locked dependencies
        run: dotnet restore Neemle.CSharpComposer.slnx --locked-mode

      - name: Check independent dependency graphs
        shell: bash
        run: |
          for project in Neemle.CSharpComposer Neemle.CSharpComposer.Tests; do
            assets=".dev-temp/obj/$project/project.assets.json"
            test -f "$assets"
            jq -e '.libraries | keys | all(test("^(Microsoft\\.CodeAnalysis|Neemle\\.GeneratorEngine)([./]|$)") | not)' "$assets"
          done

      - name: Build Release solution
        run: dotnet build Neemle.CSharpComposer.slnx -c Release --no-restore

      - name: Run tests with coverage
        run: >-
          dotnet test tests/Neemle.CSharpComposer.Tests/Neemle.CSharpComposer.Tests.csproj
          -c Release --no-build --no-restore --settings tests/coverage.runsettings
          --collect:"XPlat Code Coverage" --results-directory "${{ runner.temp }}/composer-results"
          --logger "trx;LogFileName=composer.trx"

      - name: Pack local NuGet artifact
        run: >-
          dotnet pack src/Neemle.CSharpComposer/Neemle.CSharpComposer.csproj
          -c Release --no-build --no-restore -o "${{ runner.temp }}/composer-packages"

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: composer-test-reports
          path: ${{ runner.temp }}/composer-results/
          if-no-files-found: warn

      - name: Upload local NuGet package
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: composer-nuget-package
          path: ${{ runner.temp }}/composer-packages/*.nupkg
          if-no-files-found: error
