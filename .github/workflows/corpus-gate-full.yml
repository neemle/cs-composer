name: Corpus gate (full)

# GENE-29 F1 (AD 84939297 v2 section F): the corpus gate with a larger edit sample than the CI step, report-only, in
# one job. Manual only: making it enforcing, or scheduling it, are later decisions (AD stage F6, open decision 3); the
# CI step enforces the untouched render since F4. nodes_per_file=all edits every eligible node and takes far longer.
on:
  workflow_dispatch:
    inputs:
      variants:
        description: "Edit variants: any of detach, remove, move (comma-separated), or none"
        type: string
        default: detach,remove,move
      nodes_per_file:
        description: "Edited nodes per file and variant (one per node kind until the cap), or all"
        type: string
        default: "25"
      untouched:
        description: "Untouched render: formatted or none"
        type: string
        default: formatted

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NUGET_PACKAGES: ${{ github.workspace }}/.dev-temp/nuget
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Restore and build tests
        run: |
          dotnet restore tests/Neemle.CSharpComposer.Tests/Neemle.CSharpComposer.Tests.csproj --locked-mode
          dotnet build tests/Neemle.CSharpComposer.Tests/Neemle.CSharpComposer.Tests.csproj -c Release --no-restore

      - name: Run corpus gate
        env:
          CORPUS_GATE_REPORT: ${{ runner.temp }}/composer-corpus/corpus-gate.json
          CORPUS_GATE_VARIANTS: ${{ inputs.variants }}
          CORPUS_GATE_NODES_PER_FILE: ${{ inputs.nodes_per_file }}
          CORPUS_GATE_UNTOUCHED: ${{ inputs.untouched }}
        run: >-
          dotnet test tests/Neemle.CSharpComposer.Tests/Neemle.CSharpComposer.Tests.csproj
          -c Release --no-build --no-restore --filter "Category=Corpus" --logger "console;verbosity=normal"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: corpus-gate-full
          path: ${{ runner.temp }}/composer-corpus/
          if-no-files-found: warn
