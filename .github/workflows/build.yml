name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NUGET_PACKAGES: ${{ github.workspace }}/.dev-temp/nuget
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Validate release tag and source
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          version=$(dotnet msbuild src/Neemle.CSharpComposer/Neemle.CSharpComposer.csproj -nologo -getProperty:Version)
          if [ "$RELEASE_TAG" != "v$version" ]; then
            printf 'Release tag must equal v%s.\n' "$version" >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main

      - name: Prepare output directories
        run: mkdir -p .dev-temp/packages "${{ runner.temp }}/composer-results" "${{ runner.temp }}/composer-packages"

      - name: Restore locked dependencies
        run: dotnet restore Neemle.CSharpComposer.slnx --locked-mode

      - name: Check independent dependency graphs
        shell: bash
        run: |
          for project in Neemle.CSharpComposer Neemle.CSharpComposer.Tests; do
            assets=".dev-temp/obj/$project/project.assets.json"
            test -f "$assets"
            jq -e '.libraries | keys | all(test("^(Microsoft\\.CodeAnalysis|Neemle\\.GeneratorEngine)([./]|$)") | not)' "$assets"
          done

      - name: Build Release solution
        run: dotnet build Neemle.CSharpComposer.slnx -c Release --no-restore

      - name: Run tests with coverage
        run: >-
          dotnet test tests/Neemle.CSharpComposer.Tests/Neemle.CSharpComposer.Tests.csproj
          -c Release --no-build --no-restore --settings tests/coverage.runsettings
          --collect:"XPlat Code Coverage" --results-directory "${{ runner.temp }}/composer-results"
          --logger "trx;LogFileName=composer.trx"

      - name: Pack local NuGet artifact
        run: >-
          dotnet pack src/Neemle.CSharpComposer/Neemle.CSharpComposer.csproj
          -c Release --no-build --no-restore -o "${{ runner.temp }}/composer-packages"

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: composer-test-reports
          path: ${{ runner.temp }}/composer-results/
          if-no-files-found: warn

      - name: Upload local NuGet package
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: composer-nuget-package
          path: ${{ runner.temp }}/composer-packages/*.nupkg
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Download verified package from this run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: composer-nuget-package
          path: ${{ runner.temp }}/composer-release

      - name: Publish verified package to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PACKAGE_DIRECTORY: ${{ runner.temp }}/composer-release
        shell: bash
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            printf 'Repository secret NUGET_API_KEY is required for release publication.\n' >&2
            exit 1
          fi
          package="$PACKAGE_DIRECTORY/Neemle.CSharpComposer.${RELEASE_TAG#v}.nupkg"
          test -f "$package"
          dotnet nuget push "$package" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
