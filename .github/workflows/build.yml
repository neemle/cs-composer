name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NUGET_PACKAGES: ${{ github.workspace }}/.dev-temp/nuget
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install .NET 10 and 11 SDKs
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Validate release tag and source
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          version=$(dotnet msbuild src/Neemle.CSharpComposer/Neemle.CSharpComposer.csproj -nologo -getProperty:Version)
          if [ "$RELEASE_TAG" != "v$version" ]; then
            printf 'Release tag must equal v%s.\n' "$version" >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main

      - name: Prepare output directories
        run: mkdir -p .dev-temp/packages "${{ runner.temp }}/composer-results/unit" "${{ runner.temp }}/composer-results/integration" "${{ runner.temp }}/composer-results/corpus" "${{ runner.temp }}/composer-corpus" "${{ runner.temp }}/composer-packages"

      - name: Restore locked dependencies
        run: dotnet restore Neemle.CSharpComposer.slnx --locked-mode

      - name: Check independent dependency graphs
        shell: bash
        run: |
          for project in Neemle.CSharpComposer Neemle.CSharpComposer.Tests; do
            assets=".dev-temp/obj/$project/project.assets.json"
            test -f "$assets"
            jq -e '.libraries | keys | all(test("^(Microsoft\\.CodeAnalysis|Neemle\\.GeneratorEngine)([./]|$)") | not)' "$assets"
          done

      - name: Build Release solution
        id: build
        run: dotnet build Neemle.CSharpComposer.slnx -c Release --no-restore

      - name: Run unit tests with coverage
        run: >-
          dotnet test tests/Neemle.CSharpComposer.Tests/Neemle.CSharpComposer.Tests.csproj
          -c Release --no-build --no-restore --filter "Category=Unit" --settings tests/coverage.runsettings
          --collect:"XPlat Code Coverage" --results-directory "${{ runner.temp }}/composer-results/unit"
          --logger "trx;LogFileName=composer-unit.trx"

      - name: Gate unit coverage at 100% line, branch and method
        run: dotnet run tools/CoverageGate.cs -- "${{ runner.temp }}/composer-results/unit" Unit

      # The integration run and its gate also run when the unit gate fails, so one CI run reports both categories.
      - name: Run integration tests with coverage
        id: integration-tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          dotnet test tests/Neemle.CSharpComposer.Tests/Neemle.CSharpComposer.Tests.csproj
          -c Release --no-build --no-restore --filter "Category=Integration" --settings tests/coverage.runsettings
          --collect:"XPlat Code Coverage" --results-directory "${{ runner.temp }}/composer-results/integration"
          --logger "trx;LogFileName=composer-integration.trx"

      - name: Gate integration coverage at 100% line, branch and method
        if: ${{ !cancelled() && steps.integration-tests.outcome == 'success' }}
        run: dotnet run tools/CoverageGate.cs -- "${{ runner.temp }}/composer-results/integration" Integration

      # GENE-29 S0: the corpus property gate (P1 byte identity, P2 edit locality, P3 re-parse equality), report-only.
      # It runs without the coverage collector, so the Unit and Integration gates above never depend on corpus content,
      # and it fails only on infrastructure errors. Every node of every file takes about 92 minutes here, so this step
      # checks P1 for every file and P2/P3 for a seeded sample of nodes (every node kind once per file plus 1 in 20,
      # with P3 further sampled for tests/** as AD I7 allows) to stay inside the 8-minute budget. The full run is the
      # manual "Corpus gate (full)" workflow.
      - name: Run corpus property gate (report-only)
        id: corpus-gate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        env:
          CORPUS_GATE_REPORT: ${{ runner.temp }}/composer-corpus/corpus-gate.json
          CORPUS_GATE_P3: sampled
          CORPUS_GATE_NODES: sampled
          CORPUS_GATE_NODE_SAMPLE: "20"
          CORPUS_GATE_NODE_MIN_PER_KIND: "1"
        run: >-
          dotnet test tests/Neemle.CSharpComposer.Tests/Neemle.CSharpComposer.Tests.csproj
          -c Release --no-build --no-restore --filter "Category=Corpus"
          --results-directory "${{ runner.temp }}/composer-results/corpus"
          --logger "trx;LogFileName=composer-corpus.trx" --logger "console;verbosity=normal"

      # always(): a run stopped by a timeout still uploads the progress log the gate writes as it goes.
      - name: Upload corpus gate report
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: corpus-gate
          path: ${{ runner.temp }}/composer-corpus/
          if-no-files-found: warn

      - name: Pack local NuGet artifact
        run: >-
          dotnet pack src/Neemle.CSharpComposer/Neemle.CSharpComposer.csproj
          -c Release --no-build --no-restore -o "${{ runner.temp }}/composer-packages"

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: composer-test-reports
          path: ${{ runner.temp }}/composer-results/
          if-no-files-found: warn

      - name: Upload local NuGet package
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: composer-nuget-package
          path: ${{ runner.temp }}/composer-packages/*.nupkg
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Download verified package from this run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: composer-nuget-package
          path: ${{ runner.temp }}/composer-release

      - name: Authenticate to NuGet with Trusted Publishing
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: neemle

      - name: Publish verified package to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PACKAGE_DIRECTORY: ${{ runner.temp }}/composer-release
        shell: bash
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            printf 'NuGet Trusted Publishing did not return a temporary API key.\n' >&2
            exit 1
          fi
          package="$PACKAGE_DIRECTORY/Neemle.CSharpComposer.${RELEASE_TAG#v}.nupkg"
          test -f "$package"
          dotnet nuget push "$package" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
